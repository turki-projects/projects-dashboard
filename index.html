<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة متابعة مراكز الخدمات التسويقية للمنتجات الزراعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#34506B;
    --green-2:#4A6A8A;
    --gold:#7FA3C7;
    --stone:#F5F3EE;
    --card:#FFFFFF;
    --ink:#2B2F36;
    --sub:#7A808A;
    --rose:#9A4A3D;
    --line:#E3E7EC;
    --radius:14px;
    --shadow:0 1px 3px rgba(36,70,61,0.08), 0 6px 20px rgba(36,70,61,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--stone);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', Arial, sans-serif;
    font-weight:400;
    min-height:100vh;
  }
  h1,h2,h3,.brand,.bignum{font-family:'Almarai', Arial, sans-serif;}

  /* ===== Top bar ===== */
  header.top{
    background:var(--green);
    color:#fff;
    padding:22px 28px 0 28px;
  }
  .top-inner{max-width:1180px;margin:0 auto;}
  .brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .brand{font-size:20px;font-weight:800;letter-spacing:.2px;}
  .brand small{display:block;font-family:'IBM Plex Sans Arabic';font-weight:400;font-size:12.5px;color:#E6EBF0;margin-top:4px;}
  .data-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .btn{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    color:#fff;
    padding:9px 16px;
    border-radius:10px;
    font-family:'IBM Plex Sans Arabic';
    font-size:13.5px;
    cursor:pointer;
    transition:background .2s, transform .15s;
  }
  .btn:hover{background:rgba(255,255,255,.18);}
  .btn:active{transform:translateY(1px);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#34506B;font-weight:600;}
  .btn.gold:hover{background:#F7F6F2;}
  #fileInput{display:none;}
  #dataStatus{font-size:12px;color:#E6EBF0;}

  /* Tabs */
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:12px 18px;
    font-size:14px;
    color:#E6EBF0;
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    font-weight:500;
    transition:color .2s, border-color .2s;
  }
  .tab:hover{color:#fff;}
  .tab.active{color:#fff;border-bottom-color:var(--gold);font-weight:700;}

  /* ===== Main ===== */
  main{max-width:1180px;margin:0 auto;padding:26px 28px 60px 28px;}
  .section-title{
    font-size:15.5px;
    font-weight:700;
    color:var(--green);
    margin:34px 0 14px 0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-title .bar{width:5px;height:18px;background:var(--gold);border-radius:3px;display:inline-block;}
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
  }
  .card.compact{padding:16px 20px;}
  .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;}
  .grid-2.rev{grid-template-columns:.85fr 1.15fr;}
  .grid-2.equal{grid-template-columns:1fr 1fr;}
  .grid-2.tablewide{grid-template-columns:1.5fr .5fr;}
  @media (max-width:820px){ .grid-2, .grid-2.rev, .grid-2.equal, .grid-2.tablewide{grid-template-columns:1fr;} }

  /* Project header */
  .project-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:2px;}
  .project-head h1{font-size:16.5px;color:var(--green);margin:0;line-height:1.45;max-width:760px;}
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;
  }
  .badge .dot{width:8px;height:8px;border-radius:50%;}
  .badge.running{background:#E3EEE8;color:var(--green);}
  .badge.running .dot{background:#5C8A77;}
  .badge.stopped{background:#F2E3DF;color:var(--rose);}
  .badge.stopped .dot{background:var(--rose);}

  /* info list */
  .info-list{list-style:none;margin:8px 0 0 0;padding:0;}
  .info-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;
  }
  .info-list li:last-child{border-bottom:none;}
  .info-list .k{color:var(--sub);}
  .info-list .v{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:8px;}

  .doc-link{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#EDF0F4;color:var(--green);text-decoration:none;font-size:12.5px;line-height:1;flex:0 0 auto;}
  .doc-link:hover{background:#E2E7ED;}
  .doc-link.disabled{background:#F0F1F3;color:#C9CED6;opacity:.6;pointer-events:none;}

  .doc-num{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:700;text-decoration:none;cursor:pointer;}
  .doc-num:hover{text-decoration:underline;}
  .doc-num .doc-ico{font-size:12px;opacity:.85;}
  .doc-num.disabled{color:var(--ink);cursor:default;pointer-events:none;}
  .doc-num.disabled .doc-ico{opacity:.3;}

  .doc-link-wide{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:#EDF0F4;color:var(--green);font-size:11.5px;font-weight:700;text-decoration:none;white-space:nowrap;}
  .doc-link-wide:hover{background:#E2E7ED;}
  .doc-link-wide.disabled{background:#F0F1F3;color:#C9CED6;pointer-events:none;}

  .donut-wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;}
  .donut-wrap canvas{max-width:210px;max-height:210px;}
  .donut-legend{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--sub);}
  .donut-legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* stepper */
  .extract-block{margin-bottom:26px;}
  .extract-block:last-child{margin-bottom:0;}
  .extract-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:nowrap;gap:8px 10px;margin-bottom:16px;font-size:14px;}
  .ex-badge{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6px 14px;border-radius:16px;border:none;
    background:#EDF0F4;flex:0 0 auto;
  }
  .ex-badge .ex-badge-num{font-size:12px;font-weight:700;color:var(--green);white-space:nowrap;line-height:1.35;}
  .ex-badge .ex-badge-amount{font-size:11.5px;font-weight:700;color:#8A6A2E;margin-top:1px;white-space:nowrap;line-height:1.35;}
  .ex-links{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;}
  @media (max-width:420px){
    .ex-badge{padding:5px 10px;}
    .ex-badge .ex-badge-num{font-size:11.5px;}
    .ex-badge .ex-badge-amount{font-size:11px;}
    .ex-links .doc-link-wide{font-size:10.5px;padding:4px 9px;gap:5px;}
  }
  .stepper{margin:22px 4px 6px 4px;}
  .step-row{display:flex;justify-content:space-between;}
  .step-labels .label-item{width:16.6%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 2px;min-height:42px;}
  .step-labels .lbl-main{font-size:10px;font-weight:700;color:var(--ink);line-height:1.2;}
  .step-labels .lbl-sub{font-size:9px;font-weight:500;color:var(--sub);line-height:1.2;margin-top:2px;}
  .step-dots{position:relative;height:18px;margin:12px 0 8px 0;display:flex;justify-content:space-between;}
  .step-dots::before{content:'';position:absolute;top:50%;left:0;right:0;height:4px;background:var(--line);border-radius:2px;transform:translateY(-50%);z-index:0;}
  .step-dots .progress{position:absolute;top:50%;right:0;height:4px;background:var(--green-2);border-radius:2px;transform:translateY(-50%);z-index:1;transition:width .4s;}
  .step-dots .dot-item{position:relative;z-index:2;width:16.6%;display:flex;justify-content:center;}
  .step-dots .dot{width:18px;height:18px;border-radius:50%;background:var(--line);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);}
  .step-dots .dot.done{background:var(--green-2);box-shadow:0 0 0 2px var(--green-2);}
  .step-dates .date-item{width:16.6%;text-align:center;font-size:10.5px;color:var(--sub);}
  .step-dates .date-item.done{color:var(--green);font-weight:600;}
  hr.soft{border:none;border-top:1px solid var(--line);margin:24px 0;}

  .insights{padding:14px 18px;}
  .ins-head{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ins-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;border-top:1px solid var(--line);}
  .ins-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .ins-row.ok .ins-dot{background:#5C8A77;} .ins-row.warn .ins-dot{background:#E0A93B;} .ins-row.bad .ins-dot{background:#C6543F;}
  .f-chips{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;}
  .f-chip{border:none;background:#EDF0F4;color:var(--green);padding:6px 14px;border-radius:16px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
  .f-chip.on{background:var(--green);color:#fff;}
  .pw-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11.5px;line-height:1.5;font-weight:700;}
  .pw-badge.s0{background:#F3DCD7;color:#9A3B2B;} .pw-badge.s1{background:#F6E8C6;color:#8A6A2E;} .pw-badge.s2{background:#DCEFE3;color:#2E6B47;}
  /* tables */
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .scroll-x > table{min-width:620px;}
  .grid-2 > .card{min-width:0;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:#EDF0F4;color:var(--green);text-align:center;font-weight:700;
    padding:10px 8px;border-bottom:2px solid var(--line);
  }
  tbody td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);}
  tfoot td{padding:11px 8px;text-align:center;border-top:2px solid var(--gold);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#F7F6F2;}
  .status-cell{display:flex;flex-direction:column;gap:5px;align-items:center;}
  .mini-bar{width:100%;max-width:170px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .mini-bar i{display:block;height:100%;background:var(--gold);}
  .mini-bar i.done{background:var(--green-2);}
  .status-text{font-size:12px;}
  .empty-note{color:var(--sub);font-size:13px;text-align:center;padding:22px 0;}

  /* summary cards */
  .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  @media (max-width:980px){.summary-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.summary-grid{grid-template-columns:1fr;}}
  .proj-card{cursor:pointer;transition:transform .15s, box-shadow .15s;}
  .proj-card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(36,70,61,.12), 0 10px 26px rgba(36,70,61,.10);}
  .proj-card .card-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .proj-card h3{font-size:14.5px;margin:0;color:var(--green);}
  .proj-card .val{font-size:12.5px;color:var(--sub);margin-top:10px;}
  .proj-card .val b{color:var(--ink);}
  .proj-bar{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px;}
  .proj-bar i{display:block;height:100%;background:var(--green-2);}

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:820px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  .kpi{padding:18px;}
  .kpi .lbl{font-size:12.5px;color:var(--sub);margin-bottom:6px;}
  .kpi .bignum{font-size:22px;color:var(--green);font-weight:800;line-height:1.3;}
  .kpi .bignum .n{letter-spacing:.3px;font-variant-numeric:tabular-nums;}
  .kpi .bignum .u{font-size:12px;color:var(--sub);font-weight:600;margin-right:6px;}
  .kpi{border-top:3px solid var(--line);}
  .kpi-row .kpi:nth-child(2){border-top-color:#5C8A77;} .kpi-row .kpi:nth-child(3){border-top-color:#E0A93B;} .kpi-row .kpi:nth-child(4){border-top-color:#34506B;} .kpi-row .kpi:nth-child(5){border-top-color:#C6543F;}
  @media (max-width:520px){.kpi{padding:14px 12px;} .kpi .bignum{font-size:17px;} .kpi .bignum .u{display:block;margin:0;font-size:11px;}}

  footer{text-align:center;color:var(--sub);font-size:12px;padding:20px 0 40px;}

  /* ===== PDF report layout (used only inside the combined PDF export) ===== */
  .pdf-project{margin-bottom:0;}
  .pdf-project-title{background:var(--green);color:#fff;padding:16px 22px;border-radius:14px 14px 0 0;font-family:'Almarai';font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .pdf-project-title .pdf-badge{font-size:13.5px;font-weight:700;padding:6px 16px;border-radius:20px;color:#fff;white-space:nowrap;}
  .pdf-badge.pdf-badge-running{background:#2E7D53;}
  .pdf-badge.pdf-badge-stopped{background:#C0392B;}
  .pdf-body{border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:20px;background:#fff;}
  .pdf-body, .pdf-body table, .pdf-body .pdf-info-list{color:#2B2F36;}
  .pdf-panel{border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;}
  .pdf-panel:last-child{margin-bottom:0;}
  .pdf-panel-title{background:#EDF0F4;color:var(--green);font-weight:700;font-size:15.5px;padding:10px 16px;border-bottom:1px solid var(--line);}
  .pdf-panel-body{padding:18px 20px;}
  .pdf-info-list{list-style:none;margin:0 0 4px 0;padding:0;}
  .pdf-info-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px;}
  .pdf-info-list li:last-child{border-bottom:none;}
  .pdf-info-list .k{color:var(--sub);font-weight:500;}
  .pdf-info-list .v{font-weight:700;color:#2B2F36;display:inline-flex;align-items:center;gap:6px;}
  .pdf-stat-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .pdf-stat{flex:1;min-width:160px;text-align:center;background:#F7F6F2;border:1px solid var(--line);border-radius:8px;padding:12px 10px;}
  .pdf-stat .n{font-family:'Almarai';font-weight:800;font-size:21px;color:var(--green);}
  .pdf-stat .l{font-size:13px;color:var(--sub);margin-top:4px;font-weight:500;}
  .pdf-subgrid{display:flex;gap:16px;}
  .pdf-subgrid > div{flex:1;min-width:0;}
  .pdf-subtitle{font-size:14.5px;font-weight:700;color:var(--green);margin-bottom:10px;}
  table.pdf-table{width:100%;border-collapse:collapse;font-size:13.5px;border:1px solid var(--line);}
  table.pdf-table th, table.pdf-table td{border:1px solid var(--line);padding:8px 9px;text-align:center;color:#2B2F36;font-weight:500;}
  table.pdf-table thead th{background:#EDF0F4;color:var(--green);font-weight:700;}
  table.pdf-table tfoot td{background:#EEF1F5;font-weight:700;color:var(--green);}
  table.pdf-table tbody tr:last-child td{border-bottom:1px solid var(--line);}
  .pdf-project .extract-header{font-size:15.5px;}
  .pdf-project .ex-badge{padding:8px 20px;}
  .pdf-project .ex-badge .ex-badge-num{font-size:14.5px;}
  .pdf-project .ex-badge .ex-badge-amount{font-size:13.5px;}
  .pdf-project .label-item{min-height:58px;}
  .pdf-project .lbl-main{font-size:13.5px;}
  .pdf-project .lbl-sub{font-size:11.5px;}
  .pdf-project .date-item{font-size:12.5px;}
  .pdf-project .doc-link-wide{font-size:13px;padding:5px 14px;}
  .pdf-project .doc-num{font-size:13.5px;}

  /* ===== الثيم العصري (مطابق لداشبورد المستهدف) ===== */
  :root{--radius:22px;--shadow:0 8px 24px rgba(60,70,90,.08);}
  body{font-family:'Tajawal','IBM Plex Sans Arabic',Tahoma,sans-serif;}
  h1,h2,h3,.brand,.bignum{font-family:'Tajawal','Almarai',Tahoma,sans-serif;}
  .btn,.tab,.badge,.doc-link-wide{font-family:'Tajawal','IBM Plex Sans Arabic',Tahoma,sans-serif;}
  header.top{background:linear-gradient(120deg,#34506B 0%,#4A6A8A 55%,#7FA3C7 100%);border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(52,80,107,.20);}
  .btn{background:rgba(255,255,255,.2);border:none;border-radius:20px;font-weight:700;}
  .btn.gold{background:#fff;color:#34506B;}
  .btn.gold:hover{background:#EEF1F5;}
  .tab{color:rgba(255,255,255,.85);} .tab.active{border-bottom-color:#fff;}
  .section-title{font-size:17px;font-weight:800;color:#2B2F36;}
  .section-title .bar{width:8px;height:22px;border-radius:6px;background:linear-gradient(#34506B,#7FA3C7);}
  .kpi{border:none !important;color:#fff;}
  .kpi .lbl{color:rgba(255,255,255,.92);} .kpi .bignum,.kpi .bignum .n{color:#fff;} .kpi .bignum .u{color:rgba(255,255,255,.85);}
  .kpi-row .kpi:nth-child(1){background:linear-gradient(135deg,#34506B,#5B7C99);}
  .kpi-row .kpi:nth-child(2){background:linear-gradient(135deg,#4F7A68,#5C8A77);}
  .kpi-row .kpi:nth-child(3){background:linear-gradient(135deg,#5F86AA,#7FA3C7);}
  .kpi-row .kpi:nth-child(4){background:linear-gradient(135deg,#5C8A77,#7FA894);}
  .kpi-row .kpi:nth-child(5){background:linear-gradient(135deg,#A9665A,#B87A6A);}
  thead th{background:#EDF0F4;color:#34506B;}
  tfoot td{border-top-color:#7FA3C7;}
  tbody tr:hover{background:#F7F6F2;}
  .badge.running{background:#E3EEE8;color:#3F6F5C;} .badge.stopped{background:#F2E3DF;color:#9A4A3D;}
  .f-chip{background:#EDF0F4;color:#34506B;} .f-chip.on{background:#34506B;color:#fff;}

  .kgrp{font-size:13px;font-weight:700;color:#7A808A;margin:14px 4px 8px;}
  .kpi-row + .kgrp{margin-top:18px;}
  .kpi-row.k3{grid-template-columns:repeat(3,1fr);} .kpi-row.k4{grid-template-columns:repeat(4,1fr);}
  .khint{font-size:11px;opacity:.88;margin-top:4px;line-height:1.45;}
  .kpi-row .kpi.kc-val{background:linear-gradient(135deg,#34506B,#4A6A8A);}
  .kpi-row .kpi.kc-spent{background:linear-gradient(135deg,#4F7A68,#5C8A77);}
  .kpi-row .kpi.kc-rem{background:linear-gradient(135deg,#A9665A,#B87A6A);}
  .kpi-row .kpi.kc-under{background:linear-gradient(135deg,#6F9A8B,#8FB3A4);}
  .kpi-row .kpi.kc-reg{background:linear-gradient(135deg,#5F86AA,#7FA3C7);}
  .kpi-row .kpi.kc-sum{background:linear-gradient(135deg,#B8935A,#C9AE7C);}
  .kpi-row .kpi.kc-all{background:linear-gradient(135deg,#5E6772,#7C8794);}
  @media (max-width:760px){.kpi-row.k4{grid-template-columns:repeat(2,1fr);} .kpi-row.k3{grid-template-columns:repeat(2,1fr);}}
  .pdf-project .kpi-row.k3{grid-template-columns:repeat(3,1fr) !important;} .pdf-project .kpi-row.k4{grid-template-columns:repeat(4,1fr) !important;}

  .sum-wrap{padding:20px 22px;}
  .sum-top{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;}
  .sum-big .l{font-size:13px;color:#7A808A;}

function buildReefStepperHtml(reefRows, consultant){
  if(!reefRows.length){
    return '<div class="empty-note">لا توجد مستخلصات مسجلة لهذا المشروع بعد</div>';
  }
  return reefRows.map(r=>{
    let lastDoneIndex = -1;
    STAGE_KEYS.forEach((k,idx)=>{ if(r.stages[k]) lastDoneIndex = idx; });
    const progressPct = lastDoneIndex>=0 ? ((lastDoneIndex + 0.5) / STAGE_KEYS.length) * 100 : 0;
    const labels = STAGE_KEYS.map(k=>{
      const l = stageLabel(k, consultant);
      return '<div class="label-item"><span class="lbl-main">'+esc(l.main)+'</span><span class="lbl-sub">'+esc(l.sub)+'</span></div>';
    }).join('');

      const done = !!r.stages[k];
      return '<div class="dot-item"><div class="dot '+(done?'done':'')+'"></div></div>';
    }).join('');
    const dates = STAGE_KEYS.map(k=>{
      const done = !!r.stages[k];
      return '<div class="date-item '+(done?'done':'')+'">'+(done?fmtDate(r.stages[k]):'لم تصل بعد')+'</div>';

function bidiFix(s){
  return String(s===undefined||s===null?'':s).split(/(\s+)/).map(t=> (t && !/^\s+$/.test(t)) ? '\u200F'+t+'\u200F' : t).join('');
}
function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ltrWrap(s){ return '<span dir="ltr" style="unicode-bidi:isolate;display:inline-block">'+s+'</span>'; }
function fmtMoneyRaw(n){ n = Number(n)||0; return n.toLocaleString('en-US') + ' ريال'; }

function fmtDate(d){
  if(!d) return '—';
  let s;
  if(d instanceof Date){ if(isNaN(d)) return '—'; s = d.toISOString().slice(0,10); }
  else s = String(d);
  return ltrWrap(s);
}
function excelSerialToDate(serial){
  const utcDays = Math.floor(serial - 25569);
  const utcValue = utcDays * 86400;
  return new Date(utcValue * 1000);
}
function toDateStr(v){
  if(v === undefined || v === null || v === '') return '';
  if(v instanceof Date) return isNaN(v) ? '' : v.toISOString().slice(0,10);
  if(typeof v === 'number') return excelSerialToDate(v).toISOString().slice(0,10);
  const s = String(v).trim();
  if(!s) return '';
  const d = new Date(s);
  return isNaN(d) ? s : d.toISOString().slice(0,10);
}
function parseDateSafe(s){
  if(!s) return null;
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

const centerTextPlugin = {
  id:'centerText',
  afterDraw(chart){
    const opts = chart.config.options.plugins && chart.config.options.plugins.centerText;
    if(!opts) return;
    const {ctx, chartArea} = chart;
    if(!chartArea) return;
    const cx = (chartArea.left + chartArea.right)/2;
    const cy = (chartArea.top + chartArea.bottom)/2;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = "800 20px 'Almarai', Arial";
    ctx.fillStyle = opts.color || '#34506B';
    ctx.fillText(opts.line1, cx, cy - 11);
    ctx.font = "12px 'IBM Plex Sans Arabic', Arial";
    ctx.fillStyle = '#7A808A';
    ctx.fillText(opts.line2, cx, cy + 13);
    ctx.restore();
  }
};

function barGradient(colorTop, colorBottom){
  return function(context){
    const chart = context.chart;
    const {ctx, chartArea} = chart;
    if(!chartArea) return colorBottom; // قبل اكتمال القياس الأول
    const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
    g.addColorStop(0, colorTop);
    g.addColorStop(1, colorBottom);
    return g;
  };
}

function readSheet(wb, name){
  const ws = wb.Sheets[name];
  if(!ws) return [];
  // توحيد أسماء الأعمدة: إزالة المسافات الزائدة والرموز غير المرئية حتى لا يفشل قراءة عمود بسبب فرق بسيط في الكتابة
  const clean = k => String(k).replace(/[\u200B-\u200F\u202A-\u202E\u00A0]/g,' ').replace(/\s+/g,' ').trim();
  return XLSX.utils.sheet_to_json(ws, {defval:''}).map(row=>{
    const o = {};
    Object.keys(row).forEach(k=>{ o[clean(k)] = row[k]; });
    return o;
  });
}

function loadWorkbook(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      applyWorkbookArrayBuffer(e.target.result, file.name);
    }catch(err){
      alert('تعذّرت قراءة الملف. تأكد أنه بنفس تنسيق قالب البيانات.\n' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Try to auto-load a data file hosted next to this dashboard (for a stable shared link
// that always shows the latest data without anyone needing to click "update").
// Silently falls back to the built-in sample data if none is found (e.g. opened locally).
async function autoLoadHostedData(){
  const candidates = ['project-data.xlsx', 'بيانات_لوحة_المشاريع.xlsx'];
  for(const name of candidates){
    try{
      const res = await fetch(encodeURI(name), {cache:'no-store'});
      if(!res.ok) continue;
      const buf = await res.arrayBuffer();
      applyWorkbookArrayBuffer(buf, name + ' (تحميل تلقائي من الاستضافة)');
      return;
    }catch(err){ /* try next candidate / fall back silently */ }
  }
}

const PDF_MARGIN_MM = 8;
const PX_TO_MM = 0.264583; // at 96 DPI
// The dashboard's grid layouts collapse to a single column below 820px/980px/560px
// viewport widths (see the @media rules above) so they read well on phones.
// When generating the PDF from a phone, that same narrow viewport made the
// exported report collapse too, producing a squeezed layout very different
// from a laptop export. Rather than trying to fool the browser into thinking
// its window is wider (which relies on html2canvas re-rendering the page in a
// hidden iframe — unreliable on mobile Safari and the cause of the "حدث خطأ
// أثناء إنشاء ملف PDF" failure), we force the desktop grid arrangement
// directly with a short-lived override stylesheet, and widen the report
// container to match. This keeps the export lightweight and works the same
// way on every browser.
const PDF_DESKTOP_WIDTH_PX = 1180; // matches main/#app's max-width
const PDF_DESKTOP_OVERRIDE_CSS = `
  #app{width:${PDF_DESKTOP_WIDTH_PX}px !important;}
  .grid-2{grid-template-columns:1.15fr .85fr !important;}
  .grid-2.rev{grid-template-columns:.85fr 1.15fr !important;}
  .grid-2.equal{grid-template-columns:1fr 1fr !important;}
  .grid-2.tablewide{grid-template-columns:1.5fr .5fr !important;}
  .summary-grid{grid-template-columns:repeat(5,1fr) !important;}
  .kpi-row{grid-template-columns:repeat(3,1fr) !important;}
`;

function buildPdfOptions(widthMM, heightMM){
  return {
    margin: PDF_MARGIN_MM,
    image: { type: 'jpeg', quality: 1 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#F5F3EE' },
    jsPDF: { unit: 'mm', format: [widthMM, heightMM], orientation: 'portrait' },
    pagebreak: { mode: ['avoid-all'] },
    enableLinks: true
  };
}
function wait(ms){ return new Promise(res=>setTimeout(res, ms)); }

/* ============================= حسابات مشتركة ============================= */
function projectDurationInfo(p){
  const start = parseDateSafe(p.start);
  const end = parseDateSafe(p.end);
  if(!start || !end || end<=start) return null;
  const today = new Date();
  const total = daysBetween(start,end);
  const elapsed = clamp(daysBetween(start, today), 0, total);
  const remaining = total - elapsed;
  return {total, elapsed, remaining};
}
const UNDER_IDX = ETIMAD_STATUSES.indexOf('تسجيل أمر دفع (إرسال)');
function isUnderPay(st){ const i=ETIMAD_STATUSES.indexOf(st); return i>=UNDER_IDX && st!=='تم الصرف'; }
function isRegisteredStatus(st){
  const i=ETIMAD_STATUSES.indexOf(st); if(i>=0 && i<UNDER_IDX) return true;
  const n=String(st||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/\s+/g,' ').trim();
  return /^إعادة (الى|إلى) مقدم الطلب من (معمد المطالبة|مدير الإدارة|صاحب الصلاحية|المراقب)/.test(n) || n.indexOf('سيتم إعادة رفع المطالبة')===0;
}
function registeredForProject(key){
  return DATA.etimad.filter(e=>e.project===key && isRegisteredStatus(e.status)).reduce((s,e)=>s+(Number(e.amount)||0),0);
}
const SEG_COLORS={sp:'#5C8A77',un:'#8FB3A4',rg:'#7FA3C7',rm:'#D8C79F'};
function segParts(v,sp,un,rg){
  const rm=Math.max(v-sp-un-rg,0), base=Math.max(v,sp+un+rg+rm,1);
  return {rm,base,p:x=>x/base*100};
}
function projCardBody(p,completion,remainingText){

  const seg=(n,c,l)=>'<i style="width:'+g.p(n)+'%;background:'+c+'" title="'+l+': '+nf(n)+' ريال"></i>';
  const leg=(c,l,n)=>'<div class="pc-leg"><b style="background:'+c+'"></b><span>'+l+'</span><em>'+pc(n)+'</em></div>';
  return '<div class="pc-prog"><div class="pc-row"><span>نسبة الإنجاز</span><b>'+completion+'%</b></div><div class="proj-bar"><i style="width:'+completion+'%"></i></div></div>'
   + '<div class="pc-stats"><div><span>المدة المتبقية</span><b>'+remainingText+'</b></div><div><span>قيمة المشروع</span><b>'+f2(p.value)+' <small>ريال</small></b></div></div>'
   + '<div class="pc-fin"><div class="pc-fin-t">توزيع قيمة المشروع</div>'
   +   '<div class="mini-bar">'+seg(sp,SEG_COLORS.sp,'تم الصرف')+seg(un,SEG_COLORS.un,'تحت الصرف')+seg(rg,SEG_COLORS.rg,'مستخلصات مسجلة')+seg(g.rm,SEG_COLORS.rm,'المتبقي')+'</div>'
   +   '<div class="pc-legs">'+leg(SEG_COLORS.sp,'تم الصرف',sp)+leg(SEG_COLORS.un,'تحت الصرف',un)+leg(SEG_COLORS.rg,'مسجلة',rg)+leg(SEG_COLORS.rm,'المتبقي',g.rm)+'</div></div>';
}
function kpiGroupsHtml(v,sp,un,rg){

   + '</div>';

function underPayForProject(key){
  return DATA.etimad.filter(e=>e.project===key && isUnderPay(e.status)).reduce((s,e)=>s+(Number(e.amount)||0),0);

/* تنبيهات وتحليلات */
function arProjects(n){ return n===1?'مشروع واحد':n===2?'مشروعان':(n>=3&&n<=10)?n+' مشاريع':n+' مشروعًا'; }
function daysSince(d){ return Math.max(0, Math.floor((new Date()-new Date(d))/86400000)); }
function buildInsights(){
  const items=[];
  DATA.projects.forEach(p=>{
    const info=projectDurationInfo(p), nm=shortName(p.key), comp=clamp(Number(p.completion)||0,0,100);
    if(p.status==='متوقف' || !info) return;
    const el=Math.round(info.elapsed/info.total*100);
    if(p.status==='جاري' && el-comp>30) items.push({lvl:'bad', t:nm+': الإنجاز '+comp+'% مقابل '+el+'% من المدة (تأخر في الانجاز)'});
    if(info.remaining<90) items.push({lvl:info.remaining<=30?'bad':'warn', t:nm+': ينتهي خلال '+info.remaining+' يوم'});
  });
  const stuck=[];
  DATA.etimad.forEach(e=>{ if(e.status!=='تم الصرف' && e.statusDate){ const d=daysSince(e.statusDate); if(d>2) stuck.push({d, t:shortName(e.project)+' - مستخلص '+e.num+' (منصة اعتماد) في مرحلة «'+e.status+'» منذ '+d+' يوم'}); } });
  DATA.reef.forEach(r=>{
    let li=-1; STAGE_KEYS.forEach((k,i)=>{ if(r.stages[k]) li=i; });
    if(li<0 || li===STAGE_KEYS.length-1) return;
    const d=daysSince(r.stages[STAGE_KEYS[li]]); if(d<=2) return;
    const p=DATA.projects.find(x=>x.key===r.project), sl=stageLabel(STAGE_KEYS[li], (p&&p.consultant)||'');
    stuck.push({d, t:shortName(r.project)+' - مستخلص '+r.num+' (منصة ريف) في مرحلة «'+sl.main+' '+sl.sub+'» منذ '+d+' يوم'});
  });
  stuck.sort((x,y)=>y.d-x.d).forEach(x=>items.push({lvl:x.d>30?'bad':'warn', t:x.t}));
  DATA.tasks.forEach(k=>{ if(!k.date) return; const d=daysSince(k.date); if(d>3){ const tx=String(k.text||'').replace(/\s+/g,' '); items.push({lvl:d>14?'bad':'warn', t:shortName(k.project)+' - مهمة متأخرة '+d+' يوم: '+(tx.length>70?tx.slice(0,70)+'…':tx)}); } });
  const pend=(DATA.power||[]).filter(r=>r.status!=='تم').length;
  if((DATA.power||[]).length) items.push({lvl:pend?'warn':'ok', t:'التيار الكهربائي: '+(pend?arProjects(pend)+' لم يتم إدخال التيار الكهربائي لها':'تم إدخال التيار الكهربائي لجميع المشاريع')});
  if(!items.length) return '<div class="card insights"><div class="ins-row ok"><span class="ins-dot"></span>لا توجد تنبيهات حاليًا</div></div>';
  return '<div class="card insights">'+items.map((i,n)=>'<div class="ins-row '+i.lvl+'" style="'+(n?'':'border-top:none')+'"><span class="ins-dot"></span>'+esc(i.t)+'</div>').join('')+'</div>';
}
function kpiMoney(v){ const n=Number(v)||0; return '<span class="n">'+n.toLocaleString('en-US',{maximumFractionDigits:2})+'</span><span class="u">ريال</span>'; }
function spentForProject(key){
  return DATA.etimad.filter(e=>e.project===key && e.status==='تم الصرف').reduce((s,e)=>s+ (Number(e.amount)||0), 0);
}

const TASK_ROW_PALETTE = ['transparent', '#EEF1F5', 'transparent', '#EEF1F5', 'transparent'];
function projectTaskColor(key){
  const idx = DATA.projects.findIndex(p=>p.key===key);
  return TASK_ROW_PALETTE[idx>=0 ? (idx % TASK_ROW_PALETTE.length) : TASK_ROW_PALETTE.length-1];
}
function allTasksGroupedByProject(){
  const groups = DATA.projects.map(p=>({
    key: p.key,
    rows: DATA.tasks.filter(t=>t.project===p.key).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''))
  })).filter(g=>g.rows.length);
  const knownKeys = DATA.projects.map(p=>p.key);
  const leftover = DATA.tasks.filter(t=>!knownKeys.includes(t.project));
  if(leftover.length) groups.push({key:null, rows: leftover.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''))});
  return groups;
}

      ['بداية المشروع', fmtDate(p.start)+' '+docIcon((p.docs||{}).start,'مستند بداية المشروع')],
      ['إيقاف المشروع', (p.stop?fmtDate(p.stop):'—')+' '+docIcon((p.docs||{}).stop,'مستند إيقاف المشروع')],
      ['استئناف المشروع', (p.resume?fmtDate(p.resume):'—')+' '+docIcon((p.docs||{}).resume,'مستند استئناف المشروع')],
      ['مدة تمديد المشروع', (p.extension?p.extension+' يوم':'—')+' '+docIcon((p.docs||{}).extension,'مستند تمديد المشروع')],
      ['نهاية المشروع', fmtDate(p.end)],
      ['قيمة المشروع', fmtMoney(p.value)+' '+docIcon((p.docs||{}).value,'مستند قيمة المشروع')]
    ];
    const infoPanel = `
      <div class="pdf-panel">
        <div class="pdf-panel-title">بيانات المشروع</div>
        <div class="pdf-panel-body">
          <ul class="pdf-info-list">
            ${infoRows.map(r=>'<li><span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span></li>').join('')}
          </ul>
          <div class="pdf-stat-row">
            <div class="pdf-stat"><div class="n">${info ? (info.remaining+' يوم') : '—'}</div><div class="l">المدة المتبقية</div></div>
            <div class="pdf-stat"><div class="n">${clamp(Number(p.completion)||0,0,100)}%</div><div class="l">نسبة الإنجاز</div></div>
            <div class="pdf-stat"><div class="n">${spentPct}%</div><div class="l">نسبة الصرف ${ltrWrap('('+fmtMoneyRaw(spent)+')')}</div></div>
          </div>
        </div>
      </div>`;

    const reefBody = buildReefStepperHtml(reefRows, p.consultant);
    const reefPanel = `<div class="pdf-panel"><div class="pdf-panel-title">سير المستخلص في منصة ريف</div><div class="pdf-panel-body">${reefBody}</div></div>`;

    let etimadBody;
    if(!etimadRows.length){
      etimadBody = '<div class="empty-note">لا توجد بيانات اعتماد مسجلة لهذا المشروع</div>';
    }else{
      const rows = etimadRows.map(r=>{
        const done = r.status === 'تم الصرف';
        const statusDateObj = parseDateSafe(r.statusDate);
        const daysInStatus = (!done && statusDateObj) ? Math.max(daysBetween(statusDateObj, new Date()), 0) : null;
        return '<tr>'
          + '<td>'+docNumCell(r.docLink, r.num)+'</td>'
          + '<td>'+fmtMoney(r.amount)+'</td>'
          + '<td>'+(r.claimNum?ltrWrap(esc(r.claimNum)):'—')+'</td>'
          + '<td>'+esc(r.status||'—')+'</td>'
          + '<td>'+(statusDateObj?fmtDate(r.statusDate):'—')+'</td>'
          + '<td>'+(daysInStatus!==null?(daysInStatus+' يوم'):'—')+'</td>'
          + '</tr>';
      }).join('');
      etimadBody = '<table class="pdf-table"><thead><tr><th>رقم المستخلص</th><th>المبلغ</th><th>رقم المطالبة</th><th>الحالة في اعتماد</th><th>تاريخ الحالة</th><th>عدد الأيام</th></tr></thead><tbody>'+rows+'</tbody>'
        + '<tfoot><tr><td>الإجمالي</td><td>'+fmtMoney(etimadRows.reduce((s,r)=>s+(Number(r.amount)||0),0))+'</td><td></td><td></td><td></td><td></td></tr></tfoot></table>';
    }
    const etimadPanel = `<div class="pdf-panel"><div class="pdf-panel-title">سير المستخلص في منصة اعتماد</div><div class="pdf-panel-body">${etimadBody}</div></div>`;

    const manBody = manRows.length
      ? '<table class="pdf-table"><thead><tr><th>المناقلة</th><th>المبلغ</th><th>الإجراء الحالي</th></tr></thead><tbody>'
        + manRows.map(r=>'<tr><td>'+docNumCell(r.docLink,'مناقلة '+r.num)+'</td><td>'+fmtMoney(r.amount)+'</td><td>'+esc(r.action)+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="empty-note">لا توجد مناقلات مسجلة</div>';
    const musBody = musRows.length
      ? '<table class="pdf-table"><thead><tr><th>المستحدث</th><th>المبلغ</th><th>الإجراء الحالي</th></tr></thead><tbody>'
        + musRows.map(r=>'<tr><td>'+docNumCell(r.docLink,'مستحدث '+r.num)+'</td><td>'+fmtMoney(r.amount)+'</td><td>'+esc(r.action)+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="empty-note">لا توجد بنود مستحدثة مسجلة</div>';
    const manMusPanel = `
      <div class="pdf-panel">
        <div class="pdf-panel-title">المناقلات والبنود المستحدثة</div>
        <div class="pdf-panel-body">
          <div class="pdf-subgrid">
            <div><div class="pdf-subtitle">المناقلات</div>${manBody}</div>
            <div><div class="pdf-subtitle">البنود المستحدثة</div>${musBody}</div>
          </div>
        </div>
      </div>`;

    const taskBody = taskRows.length
      ? '<table class="pdf-table"><thead><tr><th style="width:100px">التاريخ</th><th style="text-align:right">المهمة</th><th style="text-align:right">الإجراء الحالي</th></tr></thead><tbody>'
        + taskRows.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td style="text-align:right">'+esc(bidiFix(r.text))+'</td><td style="text-align:right">'+(r.action?esc(bidiFix(r.action)):'—')+'</td></tr>').join('')
        + '</tbody></table>'
      : '<div class="empty-note">لا توجد مهام مسجلة لهذا المشروع</div>';
    const taskPanel = `<div class="pdf-panel"><div class="pdf-panel-title">سجل المهام والإجراءات</div><div class="pdf-panel-body">${taskBody}</div></div>`;

    const html = `
      <section class="pdf-project">
        <div class="pdf-project-title">
          <span>${esc(p.fullName || p.key)}</span>
          <span class="pdf-badge ${p.status==='جاري'?'pdf-badge-running':'pdf-badge-stopped'}">${esc(p.status)}</span>
        </div>
        <div class="pdf-body">
          ${infoPanel}
          ${reefPanel}
          ${etimadPanel}
          ${manMusPanel}
          ${taskPanel}
        </div>
      </section>`;
    return {p, info, spent, remaining, html};
  }

  // ---------------------------- live dashboard layout (unchanged) ----------------------------
  const infoHtml = `
    <div class="card compact">
      <div class="project-head">
        <h1>${esc(p.fullName || p.key)}</h1>
        <span class="badge ${badgeClass}"><span class="dot"></span>${esc(p.status)}</span>
      </div>
      <ul class="info-list">
        <li><span class="k">حالة المشروع</span><span class="v">${esc(p.status)}</span></li>
        <li><span class="k">رقم العقد</span><span class="v">${p.contractNo?esc(p.contractNo):'—'}</span></li>
        <li><span class="k">بداية المشروع</span><span class="v">${fmtDate(p.start)} ${docIcon((p.docs||{}).start,'مستند بداية المشروع')}</span></li>
        <li><span class="k">إيقاف المشروع</span><span class="v">${p.stop?fmtDate(p.stop):'—'} ${docIcon((p.docs||{}).stop,'مستند إيقاف المشروع')}</span></li>
        <li><span class="k">استئناف المشروع</span><span class="v">${p.resume?fmtDate(p.resume):'—'} ${docIcon((p.docs||{}).resume,'مستند استئناف المشروع')}</span></li>
        <li><span class="k">مدة تمديد المشروع</span><span class="v">${p.extension?p.extension+' يوم':'—'} ${docIcon((p.docs||{}).extension,'مستند تمديد المشروع')}</span></li>
        <li><span class="k">نهاية المشروع</span><span class="v">${fmtDate(p.end)}</span></li>
        <li><span class="k">قيمة المشروع</span><span class="v">${fmtMoney(p.value)} ${docIcon((p.docs||{}).value,'مستند قيمة المشروع')}</span></li>
      </ul>
    </div>
    <div class="card donut-wrap">
      <canvas id="donutProject" width="210" height="210"></canvas>
      <div class="donut-legend">
        <span><i class="swatch" style="background:#34506B"></i> منقضي</span>
        <span><i class="swatch" style="background:#E3E7EC"></i> متبقي</span>
      </div>
    </div>
  `;

  const reefHtml = buildReefStepperHtml(reefRows, p.consultant);

  let etimadTable = '';
  if(!etimadRows.length){
    etimadTable = '<div class="empty-note">لا توجد بيانات اعتماد مسجلة لهذا المشروع</div>';
  }else{
    const rows = etimadRows.map(r=>{
      const idx = ETIMAD_STATUSES.indexOf(r.status);
      const pct = idx>=0 ? Math.round((idx/(ETIMAD_STATUSES.length-1))*100) : 0;
      const done = r.status === 'تم الصرف';
      const statusDateObj = parseDateSafe(r.statusDate);
      const daysInStatus = (!done && statusDateObj) ? Math.max(daysBetween(statusDateObj, new Date()), 0) : null;
      return '<tr>'
        + '<td>'+docNumCell(r.docLink, r.num)+'</td>'
        + '<td>'+fmtMoney(r.amount)+'</td>'
        + '<td>'+(r.claimNum?ltrWrap(esc(r.claimNum)):'—')+'</td>'
        + '<td><div class="status-cell"><div class="status-text">'+esc(r.status||'—')+'</div>'
        + '<div class="mini-bar"><i class="'+(done?'done':'')+'" style="width:'+pct+'%"></i></div></div></td>'
        + '<td>'+(statusDateObj?fmtDate(r.statusDate):'—')+'</td>'
        + '<td>'+(daysInStatus!==null?(daysInStatus+' يوم'):'—')+'</td>'
        + '</tr>';
    }).join('');
    etimadTable = '<div class="scroll-x"><table><thead><tr><th>رقم المستخلص</th><th>مبلغ المستخلص</th><th>رقم المطالبة</th><th>الحالة في منصة اعتماد</th><th>تاريخ الحالة</th><th>عدد الأيام</th></tr></thead><tbody>'+rows+'</tbody>'
      + '<tfoot><tr><td style="font-weight:700;color:var(--green);background:#EEF1F5">الإجمالي</td>'
      + '<td style="font-weight:700;color:var(--green);background:#EEF1F5">'+fmtMoney(etimadRows.reduce((s,r)=>s+(Number(r.amount)||0),0))+'</td>'
      + '<td style="background:#EEF1F5"></td><td style="background:#EEF1F5"></td><td style="background:#EEF1F5"></td><td style="background:#EEF1F5"></td></tr></tfoot></table></div>';
  }

  const moneyCard = `<div class="card donut-wrap"><canvas id="donutMoney" width="210" height="210"></canvas>
      <div class="donut-legend">
        <span><i class="swatch" style="background:#34506B"></i> مصروف</span>
        <span><i class="swatch" style="background:#E3E7EC"></i> متبقي</span>
      </div>
    </div>`;

  const manTable = manRows.length
    ? '<table><thead><tr><th>المناقلة</th><th>المبلغ</th><th>الإجراء الحالي</th></tr></thead><tbody>'
      + manRows.map(r=>'<tr><td>'+docNumCell(r.docLink, 'مناقلة '+r.num)+'</td><td>'+fmtMoney(r.amount)+'</td><td>'+esc(r.action)+'</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty-note">لا توجد مناقلات مسجلة</div>';

  const musTable = musRows.length
    ? '<table><thead><tr><th>المستحدث</th><th>المبلغ</th><th>الإجراء الحالي</th></tr></thead><tbody>'
      + musRows.map(r=>'<tr><td>'+docNumCell(r.docLink, 'مستحدث '+r.num)+'</td><td>'+fmtMoney(r.amount)+'</td><td>'+esc(r.action)+'</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty-note">لا توجد بنود مستحدثة مسجلة</div>';

  const taskTable = taskRows.length
    ? '<table><thead><tr><th style="width:120px">التاريخ</th><th style="text-align:right;padding-right:16px">المهمة</th><th style="text-align:right;padding-right:16px">الإجراء الحالي</th></tr></thead><tbody>'
      + taskRows.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td style="text-align:right;padding-right:16px">'+esc(r.text)+'</td><td style="text-align:right;padding-right:16px">'+(r.action?esc(r.action):'—')+'</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty-note">لا توجد مهام مسجلة لهذا المشروع</div>';

  const html = `
    <div class="grid-2 rev">${infoHtml}</div>

    <div class="section-title"><span class="bar"></span> سير المستخلص في منصة ريف</div>
    <div class="card">${reefHtml}</div>

    <div class="section-title"><span class="bar"></span> سير المستخلص في منصة اعتماد</div>
    <div class="grid-2 tablewide">
      <div class="card">${etimadTable}</div>
      ${moneyCard}
    </div>

    <div class="section-title"><span class="bar"></span> المناقلات والبنود المستحدثة</div>
    <div class="grid-2 equal">
      <div class="card"><h3 style="margin:0 0 12px;font-size:14px;color:var(--green)">المناقلات</h3>${manTable}</div>
      <div class="card"><h3 style="margin:0 0 12px;font-size:14px;color:var(--green)">البنود المستحدثة</h3>${musTable}</div>
    </div>

    <div class="section-title"><span class="bar"></span> سجل المهام والإجراءات</div>
    <div class="card">${taskTable}</div>
  `;

  return {p, info, spent, remaining, html};
}

function renderProject(key){
  const sections = buildProjectSections(key, 'chart');
  if(!sections){ document.getElementById('app').innerHTML = '<div class="empty-note">لا توجد بيانات لهذا المشروع</div>'; return; }
  const {p, info, spent, remaining} = sections;
  document.getElementById('app').innerHTML = sections.html;

  // donut duration
  if(typeof Chart === 'undefined'){
    const note = '<div class="empty-note">تعذّر تحميل مكتبة الرسوم البيانية (Chart.js). تحقّق من اتصال الجهاز بالإنترنت ثم أعد فتح الملف.</div>';
    document.getElementById('donutProject').parentElement.innerHTML = note;
    document.getElementById('donutMoney').parentElement.innerHTML = note;
    return;
  }
  destroyChart('donutProject');
  const c1 = document.getElementById('donutProject').getContext('2d');
  if(info){
    chartsRegistry['donutProject'] = new Chart(c1, {
      type:'doughnut',
      data:{labels:['منقضي','متبقي'], datasets:[{data:[info.elapsed, info.remaining], backgroundColor:['#34506B','#E3E7EC'], borderWidth:0}]},
      options:{cutout:'72%', plugins:{legend:{display:false}, centerText:{line1: info.remaining + ' يوم', line2:'متبقٍ على الانتهاء'}}}
    });
  }else{
    chartsRegistry['donutProject'] = new Chart(c1, {
      type:'doughnut', data:{labels:['غير محدد'], datasets:[{data:[1], backgroundColor:['#E3E7EC']}]},
      options:{cutout:'72%', plugins:{legend:{display:false}, centerText:{line1:'—', line2:'تواريخ غير مكتملة'}}}
    });
  }

  // donut money
  destroyChart('donutMoney');
  const c2 = document.getElementById('donutMoney').getContext('2d');
  chartsRegistry['donutMoney'] = new Chart(c2, {
    type:'doughnut',
    data:{labels:['مصروف','متبقي'], datasets:[{data:[spent, remaining], backgroundColor:['#34506B','#E3E7EC'], borderWidth:0}]},
    options:{cutout:'72%', plugins:{legend:{display:false}, centerText:{line1: Math.round((spent/((p.value)||1))*100)+'%', line2:'نسبة الصرف'}}}
  });
}

/* ============================= التحكم العام ============================= */
function renderTarget(){
  const src=document.getElementById('tgtSrc').textContent.replace(/<\\\/script/g,'</script');
  const url=URL.createObjectURL(new Blob([src],{type:'text/html'}));
  const app=document.getElementById('app');
  app.innerHTML='<iframe id="tgtFrame" src="'+url+'" style="width:100%;height:1400px;border:0;display:block;max-width:1180px;margin:0 auto" scrolling="no"></iframe>';
  document.getElementById('tgtFrame').addEventListener('load',()=>{ if(window.LAST_XLSX){ document.getElementById('tgtFrame').contentWindow.postMessage({xlsx:window.LAST_XLSX},'*'); } });
}
window.addEventListener('message',e=>{ if(e.data&&e.data.tgtH){ const f=document.getElementById('tgtFrame'); if(f) f.style.height=(e.data.tgtH+10)+'px'; } });
function renderApp(){
  document.querySelectorAll('[id^="pdf"]').forEach(b=>{ b.style.display=(currentFilter==='__target')?'none':''; });
  const tpb=document.getElementById('tgtPdfBtn');
  if(tpb){ tpb.style.display=(currentFilter==='__target')?'':'none'; tpb.onclick=()=>{
    tpb.disabled=true; tpb.textContent='جارٍ إنشاء PDF…';
    const old=document.getElementById('tgtPdfFrame'); if(old) old.remove();
    const src=document.getElementById('tgtSrc').textContent.replace(/<\\\/script/g,'</script');
    const hf=document.createElement('iframe'); hf.id='tgtPdfFrame'; hf.name='tgtpdf';
    hf.style.cssText='position:fixed;left:0;top:0;width:1000px;height:1700px;border:0;opacity:0.01;pointer-events:none;z-index:-1';
    hf.src=URL.createObjectURL(new Blob([src],{type:'text/html'}));
    hf.addEventListener('load',()=>{
      if(window.LAST_XLSX){ hf.contentWindow.postMessage({xlsx:window.LAST_XLSX},'*'); }
      setTimeout(()=>{ hf.contentWindow.postMessage({tgtPdf:true},'*'); },2200);
    });
    document.body.appendChild(hf);
  }; }
  if(!window.__tgtPdfBound){ window.__tgtPdfBound=true; window.addEventListener('message',e=>{ if(e.data&&e.data.tgtPdfDone){ const b=document.getElementById('tgtPdfBtn'); if(b){ b.disabled=false; b.textContent='⬇ حفظ PDF'; } const hf=document.getElementById('tgtPdfFrame'); if(hf) setTimeout(()=>hf.remove(),500); } }); }
  if(currentFilter === '__target'){ renderTarget(); }
  else if(currentFilter === 'all'){ renderSummary(); }
  else{ renderProject(currentFilter); }
}

renderTabs();
renderApp();
autoLoadHostedData();
</script>
